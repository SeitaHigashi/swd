name: Pre-release (Windows build)

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  build:
    # Windows-only app (see src-tauri/src/lib.rs's target_os gates), so CI
    # builds on the same platform it actually ships to.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}
          name: dev build ${{ github.run_number }} (${{ github.sha }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
