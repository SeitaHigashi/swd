name: Release (Windows build)

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    # Windows-only app (see src-tauri/src/lib.rs's target_os gates), so CI
    # builds on the same platform it actually ships to.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bump minor version
        id: version
        # Auto-bumps X.Y.Z -> X.(Y+1).0 on every push to main and commits
        # it back, so main's version always matches the release it cuts.
        # Pushes made with GITHUB_TOKEN don't retrigger workflows, so this
        # doesn't cause an infinite loop.
        run: |
          $ErrorActionPreference = "Stop"

          $confPath = "src-tauri/tauri.conf.json"
          $current = (Get-Content $confPath -Raw | ConvertFrom-Json).version
          $parts = $current.Split(".")
          $newVersion = "$($parts[0]).$([int]$parts[1] + 1).0"

          foreach ($path in @("src-tauri/tauri.conf.json", "package.json")) {
            $content = Get-Content $path -Raw
            $content = $content -replace '"version":\s*"[^"]+"', "`"version`": `"$newVersion`""
            Set-Content $path $content -NoNewline
          }

          $cargoPath = "src-tauri/Cargo.toml"
          $content = Get-Content $cargoPath -Raw
          $content = $content -replace '(?m)^version = "[^"]+"', "version = `"$newVersion`""
          Set-Content $cargoPath $content -NoNewline

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src-tauri/tauri.conf.json package.json src-tauri/Cargo.toml
          git commit -m "chore: bump version to v$newVersion"
          git push origin HEAD:main

          $sha = git rev-parse HEAD
          "version=$newVersion" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ steps.version.outputs.sha }}
          prerelease: false
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
